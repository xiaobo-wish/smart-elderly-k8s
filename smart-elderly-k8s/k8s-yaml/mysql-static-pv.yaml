---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xhzb-mysql-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
  nfs:
    server: 192.168.88.100        # TODO: NFS server IP
    path: /data/nfs/xhzb-mysql   # TODO: 导出目录
