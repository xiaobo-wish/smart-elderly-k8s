apiVersion: apps/v1
kind: Deployment
metadata:
  name: xhzb-milvus
  namespace: xhzb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xhzb-milvus
  template:
    metadata:
      labels:
        app: xhzb-milvus
    spec:
      containers:
        - name: milvus
          image: harbor:443/xhzb/milvus:v2.4.17
          imagePullPolicy: IfNotPresent
          command:
            - milvus
            - run
            - standalone
          env:
            - name: ETCD_ENDPOINTS
              value: xhzb-etcd:2379
            - name: MINIO_ADDRESS
              value: xhzb-minio:9000
            - name: MINIO_ACCESS_KEY_ID   # 连接对象存储的 root 用户名
              value: minioadmin
            - name: MINIO_SECRET_ACCESS_KEY   # 连接对象存储的 root 密码
              value: minioadmin
            - name: MINIO_BUCKET_NAME    # 对象存储创建成功以后、会自动创建一个名字叫 a-bucket 的村村桶、写入相关信息
              value: a-bucket
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 19530
            - containerPort: 9091
          readinessProbe:
            tcpSocket:
              port: 19530
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: xhzb-milvus-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xhzb-milvus-pvc
  namespace: xhzb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: xhzb-milvus
  namespace: xhzb
spec:
  selector:
    app: xhzb-milvus
  ports:
    - port: 19530
      targetPort: 19530
