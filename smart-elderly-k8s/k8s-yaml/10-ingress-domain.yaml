apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xhzb-api
  namespace: xhzb
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  rules:
    - host: xhzb.itcast.cn
      http:
        paths:
          - path: /prod-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: xhzb-admin
                port:
                  number: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xhzb-ui
  namespace: xhzb
spec:
  ingressClassName: nginx
  rules:
    - host: xhzb.itcast.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xhzb-ui
                port:
                  number: 80
